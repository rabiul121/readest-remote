<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6fb">
  <title>Readest Remote</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface-container: #e9edf5;
      --surface-high: #dfe5ef;
      --ink: #1a1c20;
      --muted: #5d6572;
      --outline: #747b87;
      --outline-soft: #c4c9d2;
      --primary: #365eaa;
      --on-primary: #ffffff;
      --primary-container: #d9e2ff;
      --on-primary-container: #102f68;
      --error: #ba1a1a;
      --radius: 16px;
      font-family: Roboto, "Noto Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); }
    button, select { font: inherit; color: inherit; }
    button { touch-action: manipulation; cursor: pointer; }
    button:active { transform: scale(.98); }
    button:focus-visible, select:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
    [hidden] { display: none !important; }
    .app { width: min(100%, 620px); min-height: 100dvh; margin-inline: auto; padding: max(8px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
    .topbar { height: 64px; display: flex; align-items: center; gap: 12px; }
    .topbar-copy { min-width: 0; flex: 1; }
    h1 { margin: 0; font-size: 20px; font-weight: 600; }
    .connection { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .mode-tabs { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:3px; padding:4px 0 10px; border-bottom:1px solid var(--outline-soft); }
    .mode-tab { min-width:0; min-height:58px; padding:5px 1px; border:0; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; background:transparent; color:var(--muted); }
    .mode-tab svg { width:20px; height:20px; flex:none; }
    .mode-tab span { width:100%; font-size:9px; line-height:1.1; text-align:center; overflow-wrap:anywhere; }
    .mode-tab[aria-current="page"] { background:var(--primary-container); color:var(--on-primary-container); }
    .icon-button { width: 48px; height: 48px; padding: 12px; border: 0; border-radius: 50%; display: grid; place-items: center; background: transparent; }
    .icon-button:hover { background: var(--surface-container); }
    .icon-button svg { width: 24px; height: 24px; }
    .back-button { margin-left: -8px; }
    .page { display: flex; flex: 1; flex-direction: column; gap: 20px; padding-top: 12px; }
    .page > section { display: flex; flex-direction: column; gap: 12px; }
    .section-heading { margin: 0; color: var(--muted); font-size: 12px; font-weight: 600; }
    .mode-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .mode-card { min-height: 88px; padding: 16px; border: 0; border-radius: var(--radius); display: flex; align-items: center; gap: 14px; text-align: left; background: var(--surface-container); color: var(--on-primary-container); }
    .mode-card svg { width: 28px; height: 28px; flex: none; }
    .mode-card span { font-size: 16px; font-weight: 600; }
    .action-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; }
    .row > * { flex: 1 1 180px; }
    .action-card { min-width: 0; min-height: 74px; padding: 12px 12px; border: 1px solid var(--outline-soft); border-radius: var(--radius); display: flex; align-items: center; justify-content: flex-start; gap: 10px; background: var(--surface); }
    .action-card svg { width: 24px; height: 24px; flex: none; color: var(--primary); }
    .action-card span { min-width:0; overflow-wrap:anywhere; font-size: 14px; font-weight: 500; }
    .filled { color: var(--on-primary); border-color: var(--primary); background: var(--primary); }
    .filled svg { color: var(--on-primary); }
    .tonal { color: var(--on-primary-container); border: 0; background: var(--primary-container); }
    .tonal svg { color: var(--on-primary-container); }
    .transport-row { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 10px; }
    .transport { min-height: 68px; border: 0; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: var(--surface-container); }
    .transport svg { width: 24px; height: 24px; }
    .transport span { font-size: 12px; font-weight: 500; }
    .transport.play { min-height: 72px; background: var(--primary); color: var(--on-primary); }
    .transport.play svg { width: 28px; height: 28px; }
    .speed-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .speed-row button { min-height: 54px; border: 0; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 9px; background: var(--surface-container); font-size: 14px; font-weight: 600; }
    .speed-row svg { width: 22px; height: 22px; }
    .font-action-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .jump-row { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) 48px; gap: 8px; align-items: center; }
    .jump { min-height: 52px; border: 0; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 7px; background: var(--surface-container); font-size: 14px; font-weight: 600; }
    .jump svg { width: 21px; height: 21px; }
    .settings-gear { width: 48px; height: 48px; background: var(--surface-high); }
    .settings-gear[aria-expanded="true"] { background: var(--primary-container); color: var(--on-primary-container); }
    .audio-row { display: grid; grid-template-columns: minmax(0,1fr); gap: 10px; align-items: center; }
    .audio-row.audio-active { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
    .audio-toggle, .audio-rate { min-height: 52px; border: 1px solid var(--outline-soft); border-radius: 16px; background: var(--surface); }
    .audio-toggle { display: flex; justify-content: center; align-items: center; gap: 9px; }
    .audio-toggle svg { width: 22px; height: 22px; }
    .audio-toggle[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-container); color: var(--on-primary-container); }
    .audio-rate { width: 100%; padding: 0 12px; }
    .settings-panel { margin-top: 0; padding: 14px; border-radius: 18px; background: var(--surface-container); }
    .settings-panel .font-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .font-button { min-height: 52px; border: 0; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--surface); font-weight: 600; }
    .font-button svg { width: 22px; height: 22px; }
    .status { min-height: 34px; margin-top: auto; padding: 12px 4px 2px; color: var(--muted); font-size: 12px; }
    .divider { height: 1px; background: var(--outline-soft); }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --bg:#111318; --surface:#1b1b20; --surface-container:#24262d; --surface-high:#30333a; --ink:#e3e2e9; --muted:#c3c6d0; --outline:#8d919c; --outline-soft:#454852; --primary:#b1c5ff; --on-primary:#1b305e; --primary-container:#293f70; --on-primary-container:#d9e2ff; --error:#ffb4ab; }
    }
    @media (max-width: 360px) { .app { padding-inline: 12px; } .mode-card { padding: 12px; gap: 10px; } .mode-card span { font-size: 14px; } }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 0 4 22zM4 5.5v14A2.5 2.5 0 0 1 6.5 17H20M8 7h8M8 10h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-scroll" viewBox="0 0 24 24"><path d="M7 4h11a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Zm0 0a3 3 0 0 0 0 6h13M10 14h6m-6 3h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-paragraph" viewBox="0 0 24 24"><path d="M4 5h16M4 9h16M4 13h11M4 17h11M4 21h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-speed" viewBox="0 0 24 24"><path d="M3.5 18a9 9 0 1 1 17 0M12 14l5-6M6 18h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-voice" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Zm-7-3a7 7 0 0 0 14 0m-7 7v3m-4 0h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>

    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zm7 0h4v14h-4z" fill="currentColor"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M19 5 9 12l10 7zM5 5v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m5 5 10 7-10 7zM19 5v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm0-6 1.2 2.2 2.5.5 2-1.3 2.1 2.1-1.3 2 .5 2.5 2.2 1.2v3l-2.2 1.2-.5 2.5 1.3 2-2.1 2.1-2-1.3-2.5.5L12 22l-1.2-2.2-2.5-.5-2 1.3-2.1-2.1 1.3-2-.5-2.5L2.8 13v-3L5 8.8l.5-2.5-1.3-2 2.1-2.1 2 1.3 2.5-.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4zM16 9a5 5 0 0 1 0 6m2-9a9 9 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>

    <symbol id="i-open" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>

    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M20 7v5h-5M4.6 9a8 8 0 0 1 13.1-2L20 12M4 17v-5h5m10.4 3a8 8 0 0 1-13.1 2L4 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>
  <main class="app">
    <header class="topbar">
      <button id="back" class="icon-button back-button" aria-label="Home" title="Home" hidden onclick="showHome()"><svg><use href="#i-back"/></svg></button>
      <div class="topbar-copy"><h1 id="title">Readest Remote</h1><div id="connection" class="connection">Connecting to receiver…</div></div>
      <button class="icon-button" aria-label="Connection settings" title="Connection settings" onclick="Native.openSettings()"><svg><use href="#i-gear"/></svg></button>
    </header>
    <nav id="mode-tabs" class="mode-tabs" aria-label="Control pages">
      <button class="mode-tab" data-page="home" aria-label="Home" onclick="showHome()"><svg><use href="#i-home"/></svg><span>Home</span></button>
      <button class="mode-tab" data-page="normal" onclick="openMode('normal')"><svg><use href="#i-book"/></svg><span>Normal</span></button>
      <button class="mode-tab" data-page="autoscroll" onclick="openMode('autoscroll')"><svg><use href="#i-scroll"/></svg><span>Auto</span></button>
      <button class="mode-tab" data-page="paragraph" onclick="openMode('paragraph')"><svg><use href="#i-paragraph"/></svg><span>Paragraph</span></button>
      <button class="mode-tab" data-page="speed" onclick="openMode('speed')"><svg><use href="#i-speed"/></svg><span>Speed</span></button>
      <button class="mode-tab" data-page="tts" onclick="openMode('tts')"><svg><use href="#i-voice"/></svg><span>TTS</span></button>
    </nav>
    <div id="home" class="page">
      <section>
        <h2 class="section-heading">READEST</h2>
        <div class="action-grid">
          <button class="action-card filled" onclick="send('launch_readest')"><svg><use href="#i-open"/></svg><span>Open Readest</span></button>
          <button class="action-card" onclick="send('close_readest')"><svg><use href="#i-close"/></svg><span>Close Readest</span></button>
        </div>
        <div class="row"><button class="action-card" onclick="send('theme')"><svg><use href="#i-theme"/></svg><span>Cycle Readest theme</span></button></div>
      </section>
      <section>
        <h2 class="section-heading">READEST FONT</h2>
        <div class="font-action-row">
          <button class="font-button" onclick="send('font_smaller')"><svg><use href="#i-minus"/></svg><span>Smaller</span></button>
          <button class="font-button" onclick="send('font_larger')"><svg><use href="#i-plus"/></svg><span>Larger</span></button>
          <button class="font-button" onclick="send('font_reset')"><svg><use href="#i-reset"/></svg><span>Reset</span></button>
        </div>
      </section>
    </div>
    <div id="mode-page" class="page" hidden></div>
    <div id="status" class="status" role="status" aria-live="polite">Keep Readest focused on the laptop.</div>
  </main>
  <script>
    const modes={
      normal:{title:'Normal',html:`<section><h2 class="section-heading">TURN PAGES</h2><div class="action-grid"><button class="action-card" onclick="send('previous')"><svg><use href="#i-prev"/></svg><span>Previous page</span></button><button class="action-card" onclick="send('next')"><svg><use href="#i-next"/></svg><span>Next page</span></button><button class="action-card" onclick="send('previous_chapter')"><svg><use href="#i-skip-back"/></svg><span>Previous chapter</span></button><button class="action-card" onclick="send('next_chapter')"><svg><use href="#i-skip-next"/></svg><span>Next chapter</span></button></div></section>`},
      autoscroll:{title:'Auto Scroll',html:`<section><h2 class="section-heading">AUTO SCROLL</h2><div class="speed-row"><button onclick="send('autoscroll_slower')"><svg><use href="#i-minus"/></svg>Slower</button><button onclick="send('autoscroll_faster')"><svg><use href="#i-plus"/></svg>Faster</button></div><div class="row"><button class="action-card filled" onclick="send('autoscroll_pause')"><svg><use href="#i-pause"/></svg><span>Pause / play</span></button></div><div class="action-grid"><button class="action-card" onclick="send('previous')"><svg><use href="#i-prev"/></svg><span>Previous page</span></button><button class="action-card" onclick="send('next')"><svg><use href="#i-next"/></svg><span>Next page</span></button></div></section>`},
      paragraph:{title:'Paragraph Reading',html:`<section><h2 class="section-heading">PARAGRAPH READING</h2><div class="action-grid"><button class="action-card" onclick="send('paragraph_previous')"><svg><use href="#i-prev"/></svg><span>Previous paragraph</span></button><button class="action-card" onclick="send('paragraph_next')"><svg><use href="#i-next"/></svg><span>Next paragraph</span></button></div><div class="action-grid"><button class="action-card filled" onclick="send('paragraph_to_speed')"><svg><use href="#i-speed"/></svg><span>Start Speed Reading</span></button><button class="action-card" onclick="send('speed_to_normal')"><svg><use href="#i-back"/></svg><span>Exit Paragraph</span></button></div></section>`},
      speed:{title:'Speed Reading',html:`<section><h2 class="section-heading">SPEED READING</h2><div class="transport-row"><button class="transport" onclick="send('rsvp_previous_word')"><svg><use href="#i-prev"/></svg><span>Previous</span></button><button class="transport play" onclick="send('speed_pause')"><svg><use href="#i-play"/></svg><span>Play / pause</span></button><button class="transport" onclick="send('rsvp_next_word')"><svg><use href="#i-next"/></svg><span>Next</span></button></div><div class="jump-row"><button class="jump" onclick="send('rsvp_back_15')"><svg><use href="#i-skip-back"/></svg><span>15 words</span></button><button class="jump" onclick="send('rsvp_forward_15')"><svg><use href="#i-skip-next"/></svg><span>15 words</span></button><div id="audio-row" class="audio-row"><button id="audio-toggle" class="audio-toggle" aria-pressed="false" onclick="toggleAudio()"><svg><use href="#i-sound"/></svg><span>Play audio</span></button><select id="audio-rate" class="audio-rate" aria-label="Audio speed" hidden onchange="send('rsvp_audio_rate',{rate:Number(this.value)})"></select></div><div id="wpm-controls" class="speed-row"><button onclick="send('speed_slower')"><svg><use href="#i-minus"/></svg>Slower</button><button onclick="send('speed_faster')"><svg><use href="#i-plus"/></svg>Faster</button></div></section>`},
      tts:{title:'Text to Speech',html:`<section><h2 class="section-heading">TEXT TO SPEECH</h2><div class="action-grid"><button class="action-card" onclick="send('tts_previous')"><svg><use href="#i-prev"/></svg><span>Previous sentence</span></button><button class="action-card" onclick="send('tts_next')"><svg><use href="#i-next"/></svg><span>Next sentence</span></button></div><div class="action-grid"><button class="action-card filled" onclick="send('tts_pause')"><svg><use href="#i-play"/></svg><span>Pause / play</span></button><button class="action-card" onclick="send('tts_close')"><svg><use href="#i-close"/></svg><span>Stop TTS</span></button></div></section>`}
    };
    if (typeof window.Native === 'undefined') {
      let browserMode = 'normal';
      const defaultId = 'browser-controller';
      const defaultToken = 'browser-test-token-secret';
      window.Native = {
        currentMode: () => browserMode,
        receiverMode: () => browserMode,
        openSettings: () => {
          const devId = prompt('Receiver Device ID:', localStorage.getItem('readest_device_id') || defaultId);
          if (devId !== null) localStorage.setItem('readest_device_id', devId);
          const token = prompt('Receiver Device Token:', localStorage.getItem('readest_device_token') || defaultToken);
          if (token !== null) localStorage.setItem('readest_device_token', token);
        },
        command: async (action, jsonParams, id) => {
          try {
            const payload = JSON.parse(jsonParams || '{}');
            payload.action = action;
            const targetUrl = (window.location && window.location.origin && window.location.origin.startsWith('http'))
              ? `${window.location.origin}/turn`
              : 'https://127.0.0.1:18765/turn';
            const devId = localStorage.getItem('readest_device_id') || defaultId;
            const token = localStorage.getItem('readest_device_token') || defaultToken;
            const res = await fetch(targetUrl, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-Device-Id': devId,
                'X-Device-Token': token
              },
              body: JSON.stringify(payload)
            });
            const data = await res.json().catch(() => ({}));
            if (res.ok && data.ok) {
              if (action === 'set_mode' && payload.mode) {
                browserMode = payload.mode;
              }
              onRemoteResult(id, action, true, successMessage(action));
            } else {
              onRemoteResult(id, action, false, data.error || ('HTTP ' + res.status));
            }
          } catch (err) {
            onRemoteResult(id, action, false, err.message || 'Network error');
          }
        }
      };
    }
    let activeMode=Native.currentMode();
    let audioActive=false;
    let requestId=0;
    const pending=new Map();
    const statusNode=document.getElementById('status');
    const modePage=document.getElementById('mode-page');
    const homePage=document.getElementById('home');
    const rateSelectId='audio-rate';
    function renderTabs(page){for(const tab of document.querySelectorAll('[data-page]')){if(tab.dataset.page===page)tab.setAttribute('aria-current','page');else tab.removeAttribute('aria-current');}}
    function renderHome(){document.getElementById('title').textContent='Readest Remote';document.getElementById('back').hidden=true;homePage.hidden=false;modePage.hidden=true;modePage.replaceChildren();renderTabs('home');}
    function openMode(mode){const requested=modes[mode]?mode:'normal';const receiverMode=Native.receiverMode();const target=requested===receiverMode&&requested!=='normal'?'normal':requested;if(target!==receiverMode)send('set_mode',{from_mode:receiverMode,mode:target},()=>{activeMode=target;showMode(target);});else{activeMode=target;showMode(target);}}
    function showMode(mode){activeMode=mode;homePage.hidden=true;modePage.hidden=false;document.getElementById('back').hidden=true;document.getElementById('title').textContent=modes[mode].title;modePage.innerHTML=modes[mode].html;renderTabs(mode);if(mode==='speed'){const select=document.getElementById(rateSelectId);for(let n=.5;n<=3.001;n+=.25){const rate=Number(n.toFixed(2));const option=document.createElement('option');option.value=String(rate);option.textContent=rate.toFixed(2)+'×';if(rate===1)option.selected=true;select.append(option);}syncAudioState();}}
    function showHome(){renderHome();}
    function send(action,data={},afterSuccess=null){const id=String(++requestId);pending.set(id,{action,data,afterSuccess});Native.command(action,JSON.stringify(data),id);statusNode.textContent='Sending '+action.replaceAll('_',' ')+'…';}
    function successMessage(action){return ({
      set_mode:'Reading mode updated.',
      previous:'Previous page turned.',
      next:'Next page turned.',
      previous_chapter:'Previous chapter selected.',
      next_chapter:'Next chapter selected.',
      paragraph_previous:'Previous paragraph selected.',
      paragraph_next:'Next paragraph selected.',
      paragraph_to_speed:'Speed reading started.',
      speed_to_normal:'Returned to normal reading.',
      autoscroll_slower:'Auto scroll slowed.',
      autoscroll_faster:'Auto scroll sped up.',
      autoscroll_pause:'Auto scroll toggled.',
      font_smaller:'Font size decreased.',
      font_larger:'Font size increased.',
      font_reset:'Font size reset.',
      tts_previous:'Previous sentence.',
      tts_next:'Next sentence.',
      tts_pause:'TTS toggled.',
      tts_close:'TTS stopped.',
      rsvp_previous_word:'Moved to previous word.',
      rsvp_next_word:'Moved to next word.',
      rsvp_back_15:'Moved back 15 words.',
      rsvp_forward_15:'Moved forward 15 words.',
      rsvp_audio_toggle:'Audio toggled.',
      rsvp_audio_rate:'Audio speed changed.',
      rsvp_settings_toggle:'Speed Reading settings opened.',
      rsvp_font_smaller:'Speed Reading font decreased.',
      rsvp_font_larger:'Speed Reading font increased.',
      speed_pause:'Playback toggled.',
      speed_slower:'Reading slowed down.',
      speed_faster:'Reading sped up.',
      launch_readest:'Readest opened.',
      close_readest:'Readest closed.',
      theme:'Readest theme cycled.'
    })[action]||'Command sent.';}
    function onRemoteResult(id,action,success,message){const request=pending.get(id);pending.delete(id);if(!request)return;if(success){statusNode.textContent=successMessage(action);if(action==='set_mode'){activeMode=request.data.mode;if(request.afterSuccess)request.afterSuccess();}else if(action==='speed_to_normal'){activeMode='normal';renderTabs('normal');renderHome();if(request.afterSuccess)request.afterSuccess();}else if(action==='tts_close'){activeMode='normal';renderTabs('normal');renderHome();if(request.afterSuccess)request.afterSuccess();}else if(request.afterSuccess)request.afterSuccess();if(action==='rsvp_audio_toggle'){audioActive=!audioActive;syncAudioState();}}else statusNode.textContent=message||'Command failed. Check that Readest is open and focused.';}
    function syncAudioState(){const toggle=document.getElementById('audio-toggle');const rate=document.getElementById('audio-rate');const wpm=document.getElementById('wpm-controls');const row=document.getElementById('audio-row');if(!toggle||!rate||!wpm||!row)return;toggle.setAttribute('aria-pressed',String(audioActive));toggle.innerHTML=`<svg><use href="${audioActive?'#i-sound':'#i-sound-off'}"/></svg><span>${audioActive?'Stop audio':'Play audio'}</span>`;rate.hidden=!audioActive;row.classList.toggle('audio-active',audioActive);wpm.hidden=audioActive;}
    function toggleAudio(){send('rsvp_audio_toggle');}
    
    document.getElementById('connection').textContent = (typeof window.location !== 'undefined' && window.location.protocol.startsWith('http')) ? 'Connected to laptop receiver (Browser)' : 'Connected to laptop receiver';renderHome();
  </script>
</body>
